<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flask + Keycloak</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1rem; color: #222; }
    .card { border: 1px solid #e2e2e2; border-radius: 12px; padding: 1.5rem 2rem; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
    a.btn { display: inline-block; padding: .6rem 1.2rem; border-radius: 8px; text-decoration: none; font-weight: 600; }
    .login { background: #2b6cb0; color: #fff; }
    .logout { background: #e53e3e; color: #fff; }
    pre { background: #f7f7f7; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    h1 { margin-top: 0; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Flask + Keycloak</h1>
    {% if user %}
      <p>Sesión iniciada como
        <strong>{{ user.preferred_username or user.email or user.sub }}</strong>.
      </p>
      <p class="muted">Claims del usuario:</p>
      <pre>{{ user | tojson(indent=2) }}</pre>
      <a class="btn logout" href="{{ url_for('logout') }}">Cerrar sesión</a>
    {% else %}
      <p class="muted">No has iniciado sesión.</p>
      <a class="btn login" href="{{ url_for('login') }}">Iniciar sesión con Keycloak</a>
    {% endif %}
  </div>
</body>
</html>
